
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback & Suggestions | Wolf Wash</title>
    <link rel="stylesheet" href="/css/student-dashboard.css">
    <link rel="stylesheet" th:href="@{/css/issues.css}">
</head>

<body>

<div class="dashboard-container">

    <!-- SIDEBAR -->
    <div th:replace="~{fragments/student-portal :: sidebar('feedback')}"></div>

    <!-- MAIN CONTENT -->
    <main class="main-content">

        <div th:replace="~{fragments/student-portal :: topBar}"></div>

        <!-- PAGE HEADING -->
        <section class="welcome">
            <h1>Feedback &amp; Suggestions</h1>
            <p>Share your thoughts and help us improve Wolf Wash.</p>
        </section>

        <!-- MESSAGES -->
        <section th:if="${successMessage}" class="dashboard-section">
            <p style="color: #0d9588;"
               th:text="${successMessage}"></p>
        </section>

        <section th:if="${errorMessage}" class="dashboard-section">
            <p style="color: #b42318;"
               th:text="${errorMessage}"></p>
        </section>

        <!-- SUBMISSION FORM -->
        <section class="dashboard-section">

            <h2>Submit Feedback</h2>

            <form class="support-form" th:action="@{/student/feedback}" method="post">
                <div>
                    <label for="category">Submission Type</label>
                    <select id="category" name="category" required>
                        <option value="">Select a type</option>
                        <option value="FEEDBACK" th:selected="${submittedCategory == 'FEEDBACK'}">Feedback</option>
                        <option value="SUGGESTION" th:selected="${submittedCategory == 'SUGGESTION'}">Suggestion</option>
                    </select>
                </div>
                <div>
                    <label for="feedback-title">Title</label>
                    <input id="feedback-title" name="title" maxlength="150" required th:value="${submittedTitle}">
                </div>
                <div>
                    <label for="message">Your Message</label>
                    <textarea id="message" name="message" rows="5" minlength="10" maxlength="1000"
                              placeholder="Tell us what you think..." th:text="${submittedMessage}" required></textarea>
                </div>
                <button type="submit" class="feedback-button">Submit</button>
            </form>

        </section>

    </main>

</div>

</body>
</html>

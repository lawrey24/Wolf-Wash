
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Book a Time Slot | Wolf Wash</title>

    <link rel="stylesheet" th:href="@{/css/student-dashboard.css}">
    <link rel="stylesheet" th:href="@{/css/booking.css}">
</head>

<body>

<div class="dashboard-container">

    <!-- SIDEBAR -->
    <div th:replace="~{fragments/student-portal :: sidebar('book')}"></div>

    <!-- MAIN CONTENT -->
    <main class="main-content">
        <div th:replace="~{fragments/student-portal :: topBar}"></div>


        <section class="booking-heading">

            <h1>Book a Time Slot</h1>

            <p>
                Select an available time slot to reserve
                your washing and drying machines.
            </p>

        </section>

        <!-- SUCCESS MESSAGE -->
        <div class="message success-message"
             th:if="${success}"
             th:text="${success}">
        </div>

        <!-- ERROR MESSAGE -->
        <div class="message error-message"
             th:if="${bookingError}"
             th:text="${bookingError}">
        </div>

        <!-- AVAILABLE SLOTS -->
        <section class="slots-section">

            <div class="slots-header">
                <h2>Available Time Slots</h2>
            </div>

            <div class="slots-grid"
                 th:if="${not #lists.isEmpty(availableSlots)}">

                <div class="slot-card"
                     th:each="slot : ${availableSlots}">

                    <th:block th:replace="~{fragments/booking-slot :: slotDetails(${slot})}"></th:block>

                    <form th:action="@{/student/book}" method="post">

                        <input type="hidden"
                               name="slotId"
                               th:value="${slot.slotId}">

                        <button type="submit" class="book-button">
                            Book Now
                        </button>

                    </form>

                </div>

            </div>

            <!-- NO AVAILABLE SLOTS -->
            <div class="no-slots"
                 th:if="${#lists.isEmpty(availableSlots)}">

                <h3>No Available Time Slots</h3>

                <p>
                    There are currently no available time slots.
                    Please check again later.
                </p>

            </div>

        </section>

        <a th:href="@{/student/dashboard}" class="back-link">
            ← Back to Dashboard
        </a>

    </main>

</div>

</body>
</html>

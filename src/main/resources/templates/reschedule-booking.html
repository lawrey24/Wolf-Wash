
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reschedule Booking | Wolf Wash</title>

    <link rel="stylesheet" th:href="@{/css/student-dashboard.css}">
    <link rel="stylesheet" th:href="@{/css/booking.css}">
</head>

<body>

<div class="dashboard-container">

    <div th:replace="~{fragments/student-portal :: sidebar('bookings')}"></div>

    <main class="main-content">
        <div th:replace="~{fragments/student-portal :: topBar}"></div>


        <section class="booking-heading">
            <h1>Reschedule Booking</h1>
            <p>Select an available time slot for your new appointment.</p>
        </section>

        <div class="message success-message"
             th:if="${success}"
             th:text="${success}">
        </div>

        <div class="message error-message"
             th:if="${bookingError}"
             th:text="${bookingError}">
        </div>

        <section class="slots-section">

            <div class="slots-header">
                <h2>Available Time Slots</h2>
            </div>

            <div class="slots-grid" th:if="${not #lists.isEmpty(availableSlots)}">

                <div class="slot-card" th:each="slot : ${availableSlots}">

                    <th:block th:replace="~{fragments/booking-slot :: slotDetails(${slot})}"></th:block>

                    <form th:action="@{/student/reschedule}" method="post">

                        <input type="hidden"
                               name="oldSlotId"
                               th:value="${oldSlotId}">

                        <input type="hidden"
                               name="newSlotId"
                               th:value="${slot.slotId}">

                        <button type="submit" class="book-button">
                            Confirm New Slot
                        </button>

                    </form>

                </div>

            </div>

            <div class="no-slots" th:if="${#lists.isEmpty(availableSlots)}">
                <h3>No Available Slots</h3>
                <p>There are currently no available time slots for rescheduling.</p>
            </div>

        </section>

        <a th:href="@{/student/bookings}" class="back-link">
            Back to My Bookings
        </a>

    </main>

</div>

</body>
</html>

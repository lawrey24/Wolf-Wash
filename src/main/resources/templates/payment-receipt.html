<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Payment receipt | Wolf Wash</title><link rel="stylesheet" th:href="@{/css/student-dashboard.css}">
<link rel="stylesheet" th:href="@{/css/payments.css}">
<style>
@media print {
    .dashboard-container > .sidebar, .main-content > .top-bar { display: none; }
    .dashboard-container > .main-content { padding: 0; }
}
</style></head>
<body><div class="dashboard-container">
<div th:replace="~{fragments/student-portal :: sidebar('payments')}"></div>
<main class="main-content">
<div th:replace="~{fragments/student-portal :: topBar}"></div>
<article class="receipt"><h1>Wolf Wash payment receipt</h1><p>Simulated transaction</p><dl>
<dt>Receipt number</dt><dd th:text="${payment[0]}"></dd><dt>Booking number</dt><dd th:text="${payment[1]}"></dd><dt>Date paid</dt><dd th:text="${payment[2]}"></dd>
<dt>Amount paid</dt><dd th:text="|JMD ${payment[3]}|"></dd><dt>Payment method</dt><dd th:text="${payment[4]}"></dd><dt>Current status</dt><dd th:text="${payment[5]}"></dd></dl>
<nav class="receipt-actions"><button onclick="window.print()">Print receipt</button><a href="/student/payments">← Back to payments</a></nav></article></main></div></body></html>
